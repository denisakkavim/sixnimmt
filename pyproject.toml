[project]
name = "sixnimmt"
version = "0.0.1"
description = "A deterministic 6 nimmt! rules engine and in-process arena."
authors = [{ name = "Denis Akkavim", email = "foo@email.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.13"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openai>=3.8.0",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
]

[project.scripts]
sixnimmt = "sixnimmt.cli:app"

[project.urls]
Homepage = "https://denisakkavim.github.io/sixnimmt/"
Repository = "https://github.com/denisakkavim/sixnimmt"
Documentation = "https://denisakkavim.github.io/sixnimmt/"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pre-commit>=4.5.1",
    "tox-uv>=1.33.4",
    "ty>=0.0.24",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.7",
    "anyio>=4.15.0",
    "httpx2>=2.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sixnimmt"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not arena_slow'"
markers = ["arena_slow: high-volume arena validation (run explicitly with -m arena_slow)"]

[tool.ruff]
target-version = "py313"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["src"]
